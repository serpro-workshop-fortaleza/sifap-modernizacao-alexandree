services:
  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    container_name: sifap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sifap}
      POSTGRES_USER: ${POSTGRES_USER:-sifap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sifap_local}
    ports:
      - "5432:5432"
    volumes:
      - sifap-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sifap} -d ${POSTGRES_DB:-sifap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sifap-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sifap}
      POSTGRES_USER: ${POSTGRES_USER:-sifap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sifap_local}
      # Ambiente local: carrega os dados sinteticos de backend/src/main/resources/db/seed.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SIFAP_CORS_ALLOWED_ORIGINS: ${SIFAP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sifap-frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sifap-db-data:

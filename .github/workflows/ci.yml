name: CI

# `portugues-br` é a tradução de longa duração do kit do time, não uma branch de funcionalidade.
# Ela contém as mesmas especificações, o mesmo corpus legado e os mesmos portões de qualidade de
# `main`, portanto precisa das mesmas verificações.
on:
  push:
    branches: [main, develop, portugues-br, espanol, "spec/**", "impl/**"]
  pull_request:
    branches: [main, develop, portugues-br, espanol]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detectar caminhos alterados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pom.xml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            infra:
              - 'infra/**'
              - '**/*.tf'

  natural-format:
    name: Verificação de formato Natural
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Rejeitar especificações de formato decimal com vírgula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("01-archaeology/legacy-sifap/natural-programs")
          pattern = re.compile(r"\(([NP]\d+),(\d+)((?:/\d+:\d+(?:,\d+:\d+)*)?)\)")
          failures = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              for line_number, line in enumerate(path.read_text(errors="replace").splitlines(), 1):
                  for match in pattern.finditer(line):
                      spec = match.group(0)
                      fix = f"({match.group(1)}.{match.group(2)}{match.group(3)})"
                      failures.append((path, line_number, spec, fix))

          for path, line_number, spec, fix in failures:
              print(
                  f"::error file={path},line={line_number}::"
                  f"O Natural CE 9.3.3 rejeita o formato decimal com vírgula {spec} com NAT0165. Use {fix}."
              )

          if failures:
              sys.exit(1)
          PY

  backend:
    name: Servidor (Java 21 + Spring Boot)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: sifap
          POSTGRES_USER: sifap
          POSTGRES_PASSWORD: sifap_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sifap -d sifap"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configurar JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e testar
        run: |
          set -euo pipefail
          ./mvnw -B verify
      - name: Enviar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Interface web (Next.js 15 + TypeScript)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - name: Configurar Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Instalar dependências
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Executar análise estática
        run: |
          set -euo pipefail
          pnpm lint
      - name: Verificar tipos
        run: |
          set -euo pipefail
          pnpm typecheck
      - name: Testar
        run: |
          set -euo pipefail
          pnpm test --run --coverage

  infra:
    name: Infraestrutura local (Docker Compose)
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validar configuração Compose
        run: |
          set -euo pipefail
          docker compose config --quiet
      - name: Verificar serviço PostgreSQL
        run: |
          set -euo pipefail
          docker compose up -d db
          trap 'docker compose down -v' EXIT
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U sifap -d sifap; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL local não ficou saudável" >&2
          exit 1

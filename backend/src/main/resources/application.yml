spring:
  application:
    name: sifap-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:sifap}
    username: ${POSTGRES_USER:sifap}
    password: ${POSTGRES_PASSWORD:sifap_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A carga local e versionada em V900, acima do schema, e so existe no perfil `local`.
    # Sem estes padroes, alternar o perfil faria a validacao falhar por migracao aplicada
    # que nao se resolve localmente.
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

sifap:
  cors:
    # Origens explicitas; curinga nao e aceito.
    allowed-origins: ${SIFAP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
# Perfil de desenvolvimento local: adiciona a carga de dados sinteticos de db/seed.
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed
